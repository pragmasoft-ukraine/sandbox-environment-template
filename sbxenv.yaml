schemaVersion: "1"
name: your-git-project-name
agent: claude
workspace: ./workspace

kits:
  - source: sbx/claude
    args:
      model: "sonnet"
      reasoningEffort: "medium"
  - sbx/claude-sessions
  # Remove this kit if you don't use Gitea.
  - source: sbx/gitea
    args:
      host: git.pragmasoft.dev
  - sbx/playwright
  - ./kits/sandboxed
env:
  # Your git identity for commits made inside the sandbox.
  GIT_AUTHOR_NAME: "Your Name"
  GIT_AUTHOR_EMAIL: "you@example.com"
  GIT_COMMITTER_NAME: "Your Name"
  GIT_COMMITTER_EMAIL: "you@example.com"
  # Sandbox ports already published by `ports:` below. The sandboxed kit tells the
  # agent to serve on these instead of asking you to run `sbx port publish`.
  # Keep in sync with `ports:`.
  SBX_PUBLISHED_PORTS: "8000"

ports:
  - sandbox: 8000
    host: 8000

mounts:
  /home/agent/claude-history: ./history

mcp:
  servers:
    - name: context7
      url: https://mcp.context7.com/mcp/oauth

sandboxOptions:
  skills: readonly
